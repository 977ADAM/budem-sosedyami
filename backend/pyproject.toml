[project]
name = "budem-sosedyami-backend"
version = "0.4.0"
description = "Локальный FastAPI backend демо-соседей"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115.0",
    "openai>=3.31.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["app", "loadtest"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
