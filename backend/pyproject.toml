[project]
name = "budem-sosedyami-backend"
version = "0.1.0"
description = "Локальный FastAPI backend демо-соседей"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
