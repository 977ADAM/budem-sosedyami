<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Будем соседями? — простой чат</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="titles">
        <h1>Будем соседями?</h1>
        <p class="subtitle">
          Локальное демо: четыре вымышленных соседа отвечают через DeepSeek. Не вводи личные данные. После обновления страницы начнётся новый разговор.
        </p>
      </div>
      <a class="ghost" href="">Очистить диалоги</a>
    </header>

    <main class="layout">
      <aside class="agents">
        <h2>Соседи</h2>
        <label class="agent">
          <input type="radio" name="agent" value="anton" form="chat-form" checked />
          <span class="agent-name">Антон</span>
          <span class="agent-tagline">продуктовый дизайнер, работает из дома</span>
        </label>
        <label class="agent">
          <input type="radio" name="agent" value="marina" form="chat-form" />
          <span class="agent-name">Марина</span>
          <span class="agent-tagline">редактор, мама первоклассницы</span>
        </label>
        <label class="agent">
          <input type="radio" name="agent" value="pavel" form="chat-form" />
          <span class="agent-name">Павел</span>
          <span class="agent-tagline">операционный менеджер, много ездит</span>
        </label>
        <label class="agent">
          <input type="radio" name="agent" value="vera" form="chat-form" />
          <span class="agent-name">Вера</span>
          <span class="agent-tagline">фотограф, гуляет по городу</span>
        </label>
      </aside>

      <section class="chat">
        <ol id="log-anton" class="chat-log" aria-live="polite"></ol>
        <ol id="log-marina" class="chat-log" aria-live="polite"></ol>
        <ol id="log-pavel" class="chat-log" aria-live="polite"></ol>
        <ol id="log-vera" class="chat-log" aria-live="polite"></ol>

        <form id="chat-form" class="composer" autocomplete="off">
          <input
            name="message"
            type="text"
            placeholder="Напиши соседу…"
            aria-label="Сообщение соседу"
            maxlength="500"
            pattern=".*\S.*"
            required
          />
          <button name="send" type="submit">Отправить</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
